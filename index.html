<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2F5597"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="약국비서">
<title>참바른약국 비서</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Mono:wght@400;600;700&display=swap">
<style>
/* 디자인: 무매데스크(Dw02)와 같은 폰트·색·카드 스타일 */
:root{
  --sans:"Jua","Gaegu","IBM Plex Sans KR","IBM Plex Sans",system-ui,sans-serif;
  --display:"Jua","Gaegu","IBM Plex Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Jua",monospace;
  --bg:#F5F6F9; --surface:#FFFFFF; --surface-2:#F0F2F6; --line:#E1E4EB; --line-2:#CDD2DC;
  --ink:#1C2130; --ink-2:#6B7280; --ink-3:#9AA1B0;
  --accent:#2F5597; --accent-soft:#E8EEF9; --on-accent:#FFFFFF;
  --bad:#D6304A; --bad-soft:#FBE1E5; --info:#2F6FE0; --info-soft:#E4ECFB;
  --warn:#B8860B; --warn-soft:#FBF2DC; --ok:#1B9E6B; --ok-soft:#E3F6EC; --price:#2F9E8F;
  --shadow:0 1px 2px rgba(20,24,38,0.05),0 8px 24px -12px rgba(20,24,38,0.12);
  --shadow-lg:0 2px 6px rgba(20,24,38,.06),0 24px 60px -20px rgba(20,24,38,.3);
  --scrim:rgba(16,20,29,.4);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10141D; --surface:#171C28; --surface-2:#1D2330; --line:#2A3141; --line-2:#3A4356;
    --ink:#E9ECF4; --ink-2:#9BA3B5; --ink-3:#6B7385;
    --accent:#7EA6E0; --accent-soft:#1E2A3E; --on-accent:#10141D;
    --bad:#F0596E; --bad-soft:#3A2029; --info:#6FA0F0; --info-soft:#1E2A3E;
    --warn:#E0B84D; --warn-soft:#33291A; --ok:#3DCB8F; --ok-soft:#163024; --price:#4DC2B0;
    --shadow:0 1px 2px rgba(0,0,0,0.3),0 8px 24px -12px rgba(0,0,0,0.5);
    --shadow-lg:0 2px 6px rgba(0,0,0,.3),0 24px 60px -20px rgba(0,0,0,.7);
    --scrim:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10141D; --surface:#171C28; --surface-2:#1D2330; --line:#2A3141; --line-2:#3A4356;
  --ink:#E9ECF4; --ink-2:#9BA3B5; --ink-3:#6B7385;
  --accent:#7EA6E0; --accent-soft:#1E2A3E; --on-accent:#10141D;
  --bad:#F0596E; --bad-soft:#3A2029; --info:#6FA0F0; --info-soft:#1E2A3E;
  --warn:#E0B84D; --warn-soft:#33291A; --ok:#3DCB8F; --ok-soft:#163024; --price:#4DC2B0;
  --shadow:0 1px 2px rgba(0,0,0,0.3),0 8px 24px -12px rgba(0,0,0,0.5);
  --shadow-lg:0 2px 6px rgba(0,0,0,.3),0 24px 60px -20px rgba(0,0,0,.7);
  --scrim:rgba(0,0,0,.55);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;padding:0 16px;word-break:keep-all}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.app{max-width:760px;height:100%;margin:0 auto;display:flex;flex-direction:column}

/* 머리 */
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:20px 14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-family:var(--display);font-size:19px;box-shadow:var(--shadow)}
h1{font-family:var(--display);font-weight:800;font-size:clamp(20px,4vw,26px);letter-spacing:-.01em;margin:0;line-height:1.2}
.subtitle{font-size:12px;color:var(--ink-2);margin-top:2px}
.iconbtn{border:1px solid transparent;background:transparent;border-radius:10px;width:38px;height:38px;font-size:18px;line-height:1;color:var(--ink-2);display:grid;place-items:center}
.iconbtn:hover{background:var(--surface);border-color:var(--line);color:var(--ink)}

/* 오늘의 재고 */
.today{display:grid;grid-template-columns:auto 1fr;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0;margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden;transition:border-color .15s}
.today:hover{border-color:var(--line-2)}
.today .d{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;padding:11px 14px 9px;font-size:13px;letter-spacing:.04em;color:var(--ink-2)}
.today .d .num{letter-spacing:0;color:var(--ink-3);font-weight:500}
.today .ks{grid-column:1/-1;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:1px;background:var(--line);border-top:1px solid var(--line)}
.today .k{background:var(--surface);display:flex;flex-direction:column;gap:2px;padding:9px 14px 11px;min-width:0}
.today .k em{font-style:normal;font-size:11.5px;color:var(--ink-2);display:flex;align-items:center;gap:6px;white-space:nowrap}
.today .k b{font-family:var(--mono);font-size:20px;font-weight:700;letter-spacing:-.01em;line-height:1.25}
.today .k i{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 auto}
.today .go{font-size:12px;color:var(--accent);letter-spacing:0}
.today.empty{grid-template-columns:1fr auto;padding:13px 14px}
.today.empty .d{grid-column:auto;padding:0;font-size:14px;letter-spacing:0;color:var(--ink-2)}
.dot-bad{background:var(--bad)}.dot-warn{background:var(--warn)}.dot-ok{background:var(--ok)}


/* 즐겨찾기 */
.favlabel{font-size:13px;letter-spacing:.04em;color:var(--ink-2);margin:0 2px 8px}
.favs{display:flex;flex-wrap:wrap;gap:7px;padding-bottom:12px}
.fav{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;font-size:14px;color:var(--ink);box-shadow:var(--shadow);transition:border-color .15s,background .15s}
.fav:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.fav.edit{border-style:dashed;color:var(--ink-3);background:transparent;box-shadow:none}
.fav.edit:hover{color:var(--accent);background:transparent}

/* 대화 */
.chat{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px 16px}
.msg{max-width:88%;border-radius:14px;padding:10px 14px;font-size:14.5px}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--on-accent);border-bottom-right-radius:5px}
.msg.me img{display:block;max-width:180px;border-radius:10px;margin-bottom:6px}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:5px;box-shadow:var(--shadow)}
.msg.bot.thinking{color:var(--ink-3)}
.msg.err{border-color:var(--bad)}
.msg p{margin:0 0 .5em}.msg p:last-child{margin-bottom:0}
.msg ul{margin:.2em 0 .5em;padding-left:1.2em}
.msg .src{display:block;margin-top:8px;padding-top:7px;border-top:1px solid var(--line);font-size:11.5px;color:var(--ink-3)}
.msg .acts{display:flex;gap:6px;margin-top:8px}
.msg .acts button{border:1px solid var(--line);background:var(--surface-2);border-radius:7px;padding:2px 9px;font-size:12px;color:var(--ink-2)}
.msg .acts button[aria-pressed="true"]{color:var(--bad);border-color:var(--bad);background:var(--bad-soft)}
.welcome{color:var(--ink-3);font-size:13.5px;text-align:center;margin:auto 0;padding:28px 8px}
.welcome b{display:block;color:var(--ink);font-family:var(--display);font-size:20px;margin-bottom:6px}

.chip-img{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);padding:0 2px 6px}
.chip-img img{width:40px;height:40px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.chip-img button{border:0;background:none;color:var(--ink-3);font-size:12.5px;text-decoration:underline}
.composer{position:sticky;bottom:0;background:linear-gradient(to bottom,transparent,var(--bg) 14px);padding-block:14px calc(14px + env(safe-area-inset-bottom,0px))}
.composer .box{display:flex;gap:6px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:6px;box-shadow:var(--shadow);transition:border-color .15s}
.composer .box:focus-within{border-color:var(--accent)}
.composer textarea{flex:1;min-width:0;resize:none;max-height:140px;padding:9px 8px;border:0;background:transparent;font-size:16px;line-height:1.45}
.composer textarea:focus{outline:none}
.composer textarea::placeholder{color:var(--ink-3)}
.attach{border:0;background:var(--surface-2);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;font-size:16px;line-height:1;cursor:pointer}
.attach input{position:absolute;width:1px;height:1px;opacity:0}
.send{border:0;background:var(--accent);color:var(--on-accent);border-radius:8px;height:40px;padding:0 18px;font-size:14px}
.send:active{transform:translateY(1px)}
.send:disabled{opacity:.45;cursor:default}
.stop{border:1px solid var(--line);background:var(--surface-2);color:var(--ink-2);border-radius:8px;height:40px;padding:0 14px;font-size:13px}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:12px 16px;font-size:13px;margin-bottom:10px}

/* 패널 */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;justify-content:flex-end;z-index:10;animation:fade .18s ease}
.panel{width:min(720px,100%);height:100%;background:var(--bg);display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes fade{from{opacity:0}}
@keyframes slide{from{transform:translateX(24px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.scrim,.panel{animation:none}}
.panel-top{padding:calc(16px + env(safe-area-inset-top,0px)) 16px 0;display:flex;flex-direction:column;gap:12px;background:var(--bg)}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel-h h2{font-family:var(--display);font-weight:800;font-size:clamp(20px,4vw,24px);letter-spacing:-.01em;margin:0}
.panel-h .row{gap:6px;flex-wrap:nowrap}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 14px;border-bottom:1px solid var(--line);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 14px;font-size:13.5px;color:var(--ink);box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:6px;transition:border-color .15s}
.tab:hover{border-color:var(--line-2);color:var(--ink)}
.tab[aria-selected="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent),var(--shadow);color:var(--accent)}
.tab .n{font-family:var(--mono);font-size:11.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);border-radius:999px;padding:0 7px;line-height:18px}
.tab[aria-selected="true"] .n{background:var(--accent);color:var(--on-accent)}
.panel-body{flex:1;overflow-y:auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.card h3{font-size:14px;font-weight:600;letter-spacing:.04em;color:var(--ink-2);text-transform:uppercase;margin:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h3 .c{font-size:11.5px;color:var(--ink-3);font-weight:500;letter-spacing:0;text-transform:none}
.muted{color:var(--ink-3);font-size:12.5px;margin:0}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 16px;font-weight:600;font-size:13px;color:var(--ink-2);transition:border-color .15s,color .15s}
.btn:hover{border-color:var(--accent);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.05);color:var(--on-accent)}
.btn.primary:active{transform:translateY(1px)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.danger{background:var(--bad-soft);color:var(--bad);border-color:var(--bad);font-weight:700}
.btn.danger:hover{background:var(--bad);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.field{display:flex;flex-direction:column;gap:4px;font-size:11.5px;color:var(--ink-2)}
.field input,.field select,.field textarea,.search{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);color:var(--ink);font-size:14px;transition:border-color .15s,background .15s}
.field input[type=number]{font-family:var(--mono)}
.field textarea{min-height:110px;resize:vertical;line-height:1.55}
.search{width:100%}
.field input:focus,.field select:focus,.field textarea:focus,.search:focus{border-color:var(--accent);background:var(--surface);outline:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)}
.stat .k{font-size:11px;color:var(--ink-2);margin-bottom:3px}
.stat .v{font-family:var(--mono);font-size:18px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.3}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-size:11px;color:var(--ink-2);font-weight:600;text-align:right;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top;font-family:var(--mono);font-size:13px}
td:first-child{font-family:var(--sans);font-size:13.5px;white-space:normal}
td:not(:first-child){white-space:nowrap}
tr:last-child td{border-bottom:0}
tbody tr:hover td{background:var(--surface-2)}
.short{color:var(--bad);font-weight:600}
.sub{font-size:12px;color:var(--ink-3)}
.item{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;box-shadow:var(--shadow)}
.item .nm{font-weight:600}
.item .q{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.item .q b{font-size:18px;font-weight:700;letter-spacing:-.01em}
.pill{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 9px;border-radius:20px}
.p-low{background:var(--bad-soft);color:var(--bad)}.p-ok{background:var(--ok-soft);color:var(--ok)}.p-none{background:var(--surface-2);color:var(--ink-3)}
.alts{grid-column:1/-1;border-top:1px dashed var(--line-2);margin-top:8px;padding-top:8px;font-size:13px;display:flex;flex-direction:column;gap:3px}
.alts .alt{display:flex;justify-content:space-between;gap:8px}
.mitem{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.mitem:first-of-type{border-top:0;padding-top:0}
.mitem .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.mitem .t b{font-size:14px}
.mitem .b{white-space:pre-wrap;font-size:13.5px}

/* 수첩 */
.cat{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-size:15px;box-shadow:var(--shadow);transition:border-color .15s}
.cat::after{content:'›';color:var(--ink-3);font-size:18px;margin-left:10px}
.cat:hover{border-color:var(--accent)}
.cat .c{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--ink-2);font-weight:600;background:var(--surface-2);border-radius:999px;padding:1px 9px}
.acc{border:1px solid var(--line);background:var(--surface);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.acc[data-open="1"]{border-color:var(--line-2)}
.acc>button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;border:0;background:none;padding:13px 15px;font-size:14.5px}
.acc>button::after{content:'›';color:var(--ink-3);transition:transform .15s}
.acc[data-open="1"]>button::after{transform:rotate(90deg)}
.acc .ab{padding:2px 15px 14px;white-space:pre-wrap;font-size:13.5px;color:var(--ink);border-top:1px solid var(--line);padding-top:12px}
.acc .ab .row{margin-top:10px}

.exc{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:6px;align-items:center;border-top:1px solid var(--line);padding-top:8px;font-size:13.5px}
.exc input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-family:var(--mono)}
.favrow{display:grid;grid-template-columns:1fr auto;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.favrow input[type=text]{width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);font-size:13.5px}
.favrow .ctrl{display:flex;flex-direction:column;gap:4px}
.favrow label{font-size:12px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.preset{display:flex;flex-wrap:wrap;gap:6px}
.preset button{border:1px dashed var(--line-2);background:transparent;border-radius:20px;padding:5px 11px;font-size:12.5px;color:var(--ink-2)}
.preset button:hover{border-color:var(--accent);color:var(--accent)}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:12.5px;z-index:20;max-width:90%;box-shadow:var(--shadow-lg)}
textarea.fb{width:100%;height:120px;font-size:12.5px;font-family:var(--mono);border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:8px}
mark{background:var(--warn-soft);color:inherit;border-radius:3px}

/* ===== 앱 스타일 ===== */
body{background:radial-gradient(120% 340px at 50% -80px,var(--glow),transparent 70%) no-repeat,var(--bg)}
:root{--brand:#E0424F;--brand-2:#C42A3A;--glow:rgba(47,85,151,.13);--hero-1:#3563AE;--hero-2:#23427A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--brand:#E8505D;--brand-2:#B7303F;--glow:rgba(126,166,224,.12);--hero-1:#2C4C84;--hero-2:#1B2F55}}
:root[data-theme="dark"]{--brand:#E8505D;--brand-2:#B7303F;--glow:rgba(126,166,224,.12);--hero-1:#2C4C84;--hero-2:#1B2F55}
header{padding-block:calc(18px + env(safe-area-inset-top,0px)) 16px}
.mark{width:44px;height:44px;border-radius:14px;background:linear-gradient(145deg,var(--brand),var(--brand-2));color:#fff;font-size:21px;box-shadow:0 6px 16px -6px rgba(214,48,74,.55),inset 0 1px 0 rgba(255,255,255,.25)}
.iconbtn.round{width:42px;height:42px;border-radius:50%;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);color:var(--ink-2)}
.iconbtn.round:hover{color:var(--accent);border-color:var(--accent)}
/* 오늘의 재고: 앱 위젯 */
.today{background:linear-gradient(135deg,var(--hero-1),var(--hero-2));border:0;color:#fff;border-radius:20px;box-shadow:0 14px 30px -14px rgba(35,66,122,.6);position:relative;margin-bottom:12px}
.today::after{content:'';position:absolute;right:-40px;top:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.07);pointer-events:none}
.today:hover{border-color:transparent;filter:brightness(1.04)}
.today .d{color:rgba(255,255,255,.85);padding:14px 16px 10px;font-size:14px}

/* ===== 공통 ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s||'').toLowerCase().replace(/[\s()\[\]_\-.,/·:]+/g,'');
const fmt=n=>{n=+n||0;return Number.isInteger(n)?n.toLocaleString('ko-KR'):n.toLocaleString('ko-KR',{maximumFractionDigits:1})};
const r1=n=>Math.round(n*10)/10;
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
function local(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v))}catch(e){return null}}
function tokens(q){return String(q).split(/[\s,.?!·/()]+/).map(t=>t.replace(/(은|는|이|가|을|를|에|에서|으로|로|도|요|야|해|해줘|알려줘|어떻게|뭐|있어|몇|개|좀)$/,'')).filter(t=>t.length>=2)}
function copyText(txt){const ok=()=>toast('복사했어요');try{navigator.clipboard.writeText(txt).then(ok,()=>fallbackCopy(txt))}catch(e){fallbackCopy(txt)}}
function fallbackCopy(txt){const ta=document.createElement('textarea');ta.className='fb';ta.value=txt;ta.style.cssText='position:fixed;left:16px;right:16px;bottom:100px;z-index:30';document.body.appendChild(ta);ta.focus();ta.select();toast('선택했어요. 복사해서 쓰세요');setTimeout(()=>ta.remove(),8000)}
function dateLabel(d){return d?`${+d.slice(4,6)}/${+d.slice(6)}`:''}

/* ===== 저장소 상태 ===== */
const DEFAULT_SETTINGS={name:'우리 약국',tel:'',leadDays:0,bufferDays:7,periodDays:184};
const S={stock:null,prev:null,profile:{items:{}},settings:{...DEFAULT_SETTINGS},exc:{},manual:[],ready:{}};
let db=null,canWrite=true,M=null; // M = 계산된 재고 모델

function parseName(raw){let base=raw,ing='',str='';const m=raw.match(/^(.*)_\((.*)\)$/);
 if(m){base=m[1];const inner=m[2];const k=inner.indexOf(',');if(k>0){ing=inner.slice(0,k).trim();str=inner.slice(k+1).trim()}else str=inner.trim();
  if(!ing){const p=base.match(/\(([^()]+)\)\s*$/);if(p&&!/^구[:：]/.test(p[1])){ing=p[1].trim();base=base.slice(0,p.index).trim()}}}
 return{base,ing,str}}

/* 적정재고 = 품목 예외 > 조제량 기반 계산 > 약국 프로그램 값 */
function buildModel(){
 const st=S.stock;if(!st||!st.rows)return null;
 const set=S.settings,cover=(+set.leadDays||0)+(+set.bufferDays||7),P=(S.profile&&S.profile.items)||{};
 const prevMap={};(S.prev&&S.prev.rows||[]).forEach(r=>prevMap[String(r[1])]={cur:+r[5]||0,name:r[0]});
 const items=st.rows.map(r=>{const raw=String(r[0]),code=String(r[1]||''),p=parseName(raw),pf=P[code],ex=S.exc[code];
  const cur=+r[5]||0,fileOpt=+r[6]||0,daily=pf&&pf.d||0,perrx=pf&&pf.p||0,dead=!!(pf&&pf.dead);
  let opt,src;
  if(ex&&ex.opt!=null&&ex.opt!==''){opt=+ex.opt;src='예외'}
  else if(pf&&!dead&&(daily||perrx)){opt=Math.ceil(Math.max(daily*cover,perrx));src='조제량'}
  else if(dead){opt=0;src='미조제'}
  else{opt=fileOpt;src='프로그램'}
  const days=daily>0?cur/daily:null;
  return{code,raw,co:String(r[2]||''),unit:String(r[3]||''),cur,opt,src,fileOpt,ws:pf&&pf.w||'',daily,perrx,n:pf&&pf.n||0,price:pf&&pf.u||0,dead,days,ex,...p,
   prev:prevMap[code]?prevMap[code].cur:null,key:p.ing?norm(p.ing)+'|'+norm(p.str):'',ikey:p.ing?norm(p.ing):'',hay:norm(raw+' '+code+' '+r[2]+' '+(pf&&pf.w||''))}});
 const byKey={},byIng={},byCode={};
 items.forEach(i=>{byCode[i.code]=i;if(i.key){(byKey[i.key]=byKey[i.key]||[]).push(i);(byIng[i.ikey]=byIng[i.ikey]||[]).push(i)}});
 const low=items.filter(i=>!i.dead&&i.opt>0&&i.cur<i.opt);
 const urgent=low.filter(i=>i.days!=null?i.days<Math.max(3,cover/2):i.cur<i.opt*.25);
 const gone=S.prev?Object.entries(prevMap).filter(([c,v])=>v.cur>0&&(!byCode[c]||byCode[c].cur<=0)).map(([c,v])=>({code:c,name:v.name,prev:v.cur,pf:P[c]})).filter(x=>x.pf&&!x.pf.dead):[];
 const drop=S.prev?items.filter(i=>i.prev!=null&&i.daily>0&&(i.prev-i.cur)>i.daily*3).sort((a,b)=>(b.prev-b.cur)/b.daily-(a.prev-a.cur)/a.daily):[];
 const dead=items.filter(i=>i.dead).sort((a,b)=>b.cur-a.cur);
 const over=items.filter(i=>!i.dead&&i.opt>0&&i.daily>0&&i.cur>i.opt*4&&i.cur>i.daily*60).sort((a,b)=>b.cur*b.price-a.cur*a.price);
 const dm=String(st.meta||'').match(/~\s*(\d{8})/);
 return{items,byKey,byIng,byCode,low,urgent,gone,drop,dead,over,date:st.date||(dm?dm[1]:''),prevDate:S.prev&&S.prev.date||'',cover};
}

/* ===== 오늘의 재고 한 줄 ===== */
function renderToday(){

 if(!M){t.hidden=false;t.classList.add('empty');t.innerHTML='<span class="d">재고 자료가 아직 없어요</span><span class="go">파일 올리기 ›</span>';t.onclick=()=>openPanel('settings');return}
 t.hidden=false;t.classList.remove('empty');
 const ks=[`<span class="k"><em><i class="${M.urgent.length?'dot-bad':'dot-ok'}"></i>급한 주문</em><b>${M.urgent.length}</b></span>`,
  `<span class="k"><em><i class="${M.low.length?'dot-warn':'dot-ok'}"></i>발주</em><b>${M.low.length}</b></span>`];
 if(S.prev)ks.push(`<span class="k"><em><i class="${M.gone.length?'dot-bad':'dot-ok'}"></i>새로 0</em><b>${M.gone.length}</b></span>`);
 t.innerHTML=`<span class="d"><span>오늘의 재고 · <span class="num">${dateLabel(M.date)}</span></span><span class="go">자세히 ›</span></span><span class="ks">${ks.join('')}</span>`;t.onclick=()=>openPanel('stock');
}

/* ===== 패널 ===== */
let panelState={kind:null,tab:null},redrawPanel=null;
function openPanel(kind,tab){
 document.querySelector('.scrim')?.remove();
 panelState={kind,tab:tab||{stock:'order',manual:'list',memo:'memos',settings:'basic',team:'notice'}[kind]};
 const scrim=document.createElement('div');scrim.className='scrim';
 const p=document.createElement('div');p.className='panel';p.setAttribute('role','dialog');scrim.appendChild(p);
 scrim.onclick=e=>{if(e.target===scrim)close()};scrim.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
 function close(){scrim.remove();redrawPanel=null;memoEdit=null;alarmEdit=null;renderFavs()}
 const teamOn=!!(window.drawTeam&&S.pharm);
 const TITLES={alt:'대체약',stock:'재고',manual:'업무 수첩',memo:S.pharm&&!teamOn?'공지·메모·알림':'메모·알림',settings:'설정',team:'약국'};
 function draw(){
  if(!scrim.isConnected){if(redrawPanel===draw)redrawPanel=null;return}
  const tabs=kind==='stock'?[['order','발주',M?M.low.length:0],['today','오늘 변화',M?M.gone.length+M.drop.length:0],['search','검색'],['dead','안 나가는 약',M?M.dead.length:0],['over','과다 재고',M?M.over.length:0]]
   :kind==='alt'?[]
   :kind==='manual'?[['list','수첩'],['add','새 항목']]
   :kind==='team'?teamTabs()
   :kind==='memo'?(S.pharm&&!teamOn?[['notices','공지',unreadNotices().length||null]]:[]).concat([['memos','메모',S.memo.memos.length],['alarms','알림',S.memo.alarms.filter(a=>a.on).length]])
   :(window.accountView?[['account','약국 계정']]:[]).concat([['basic','기준'],['files','파일 올리기'],['exc','품목 예외',Object.keys(S.exc).length],['favs','즐겨찾기'],['etc','기타']]);
  p.innerHTML=`<div class="panel-top"><div class="panel-h"><h2>${TITLES[kind]}</h2><div class="row">${(teamOn?['team']:[]).concat(['stock','manual','memo','settings']).filter(k=>k!==kind).map(k=>`<button class="btn sm" type="button" data-go="${k}">${TITLES[k]}</button>`).join('')}<button class="iconbtn" type="button" id="pClose" aria-label="닫기">✕</button></div></div>
   <div class="tabs" role="tablist">${tabs.map(([k,l,n])=>`<button class="tab" role="tab" type="button" data-tab="${k}" aria-selected="${panelState.tab===k}">${l}${n!=null?`<span class="n">${n}</span>`:''}</button>`).join('')}</div></div><div class="panel-body" id="pbody"></div>`;
  p.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{panelState.tab=b.dataset.tab;draw()});
  p.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>openPanel(b.dataset.go));
  $('pClose').onclick=close;
  const body=$('pbody');
  if(kind==='team')drawTeam(body);else if(kind==='alt')drawAlt(body);else if(kind==='stock')drawStock(body);else if(kind==='manual')drawManual(body);else if(kind==='memo')drawMemo(body);else drawSettings(body);
 }
 redrawPanel=draw;document.body.appendChild(scrim);draw();$('pClose').focus();
}
function needStock(body){if(M)return false;body.innerHTML='<div class="card"><p class="muted">재고 자료가 없어요. 설정 › 파일 올리기에서 약국 프로그램의 재고현황 엑셀을 올려 주세요.</p><button class="btn primary" type="button" id="goFiles">파일 올리러 가기</button></div>';$('goFiles').onclick=()=>openPanel('settings','files');return true}

/* ----- 재고 패널 ----- */
function groupBy(arr,f){const g={};arr.forEach(i=>{const k=f(i);(g[k]=g[k]||[]).push(i)});return Object.entries(g)}
function orderText(groups){return `[발주 목록] ${dateLabel(M.date)} 재고 기준\n`+groups.map(([w,a])=>`\n■ ${w}\n`+a.map(i=>`- ${i.base}${i.str?' '+i.str:''}: 현재 ${fmt(i.cur)} / 적정 ${fmt(i.opt)} → 부족 ${fmt(r1(i.opt-i.cur))}${i.unit}`).join('\n')).join('\n')}
function drawStock(body){
 if(needStock(body))return;const t=panelState.tab;
 if(t==='order'){
  const urg=i=>i.days!=null?i.days:i.cur/i.opt*M.cover;
  const groups=groupBy(M.low,i=>i.ws||'사입처 정보 없음').map(([k,a])=>[k,a.sort((x,y)=>urg(x)-urg(y))]).sort((a,b)=>(a[0]==='사입처 정보 없음')-(b[0]==='사입처 정보 없음')||b[1].length-a[1].length);
  body.innerHTML=`<div class="stats"><div class="stat"><div class="k">발주 필요</div><div class="v">${M.low.length}</div></div><div class="stat"><div class="k">급함</div><div class="v">${M.urgent.length}</div></div><div class="stat"><div class="k">기준</div><div class="v" style="font-size:15px">${M.cover}일치</div></div></div>
  <div class="row" style="justify-content:space-between"><p class="muted">${dateLabel(M.date)} 재고 · 남은 일수가 적은 순 · 기준은 설정에서 바꿀 수 있어요</p>${M.low.length?'<button class="btn sm" type="button" id="cpAll">전체 복사</button>':''}</div>
  ${M.low.length?groups.map(([w,a],gi)=>`<div class="card"><h3>${esc(w)} <span class="row"><span class="c">${a.length}품목</span><button class="btn sm" type="button" data-cp="${gi}">복사</button></span></h3><div class="tablewrap"><table><thead><tr><th>약품</th><th>현재</th><th>남은 일수</th><th>적정</th><th>부족</th></tr></thead><tbody>${a.map(i=>`<tr><td>${esc(i.base)} <span class="sub">${esc(i.str)}</span></td><td>${fmt(i.cur)}</td><td>${i.days!=null?(i.days<1?'1일 미만':fmt(Math.round(i.days))+'일'):'-'}</td><td>${fmt(i.opt)}</td><td class="short">${fmt(r1(i.opt-i.cur))} ${esc(i.unit)}</td></tr>`).join('')}</tbody></table></div></div>`).join(''):'<div class="card"><p class="muted">적정재고보다 적은 약이 없어요.</p></div>'}`;
  $('cpAll')&&($('cpAll').onclick=()=>copyText(orderText(groups)));
  body.querySelectorAll('[data-cp]').forEach(b=>b.onclick=()=>copyText(orderText([groups[+b.dataset.cp]])));
 }else if(t==='today'){
  if(!S.prev){body.innerHTML='<div class="card"><p class="muted">비교할 이전 재고가 없어요. 내일 재고 파일이 들어오면 어제와 비교해서 새로 0이 된 약과 평소보다 빨리 나간 약을 보여드려요.</p></div>';return}

/* ===== 파일 읽기 ===== */
function readAoa(buf){const wb=XLSX.read(buf,{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''})}
const H=s=>String(s).replace(/\s+/g,'');
// "약품명" 제목이 몇 번째 열에 있든 찾음 (이팜 보고서마다 앞 열이 다름)
function findHdr(aoa){for(let i=0;i<Math.min(aoa.length,40);i++){const k=(aoa[i]||[]).map(H).indexOf('약품명');if(k>=0)return{h:i,nc:k}}return{h:-1,nc:-1}}
function searchDays(aoa,h){const meta=String(aoa.slice(0,h).flat().find(x=>/검색기간/.test(String(x)))||'');const m=meta.match(/(\d{8})\s*~\s*(\d{8})/);if(!m)return 0;
 const d=s=>new Date(+s.slice(0,4),+s.slice(4,6)-1,+s.slice(6,8));const n=Math.round((d(m[2])-d(m[1]))/864e5)+1;return n>0&&n<800?n:0}
async function onStockFile(e){const f=e.target.files[0];e.target.value='';if(!f)return;
 if(!window.XLSX){toast('엑셀 읽기 도구를 불러오지 못했어요. 새로고침 후 다시 해 주세요');return}
 await importStock(new Uint8Array(await f.arrayBuffer()),'upload')}
async function importStock(buf,source){
 try{const aoa=readAoa(buf);const {h,nc}=findHdr(aoa);
  if(h<0)throw new Error('약품명 열을 찾지 못했어요. 재고현황 파일인지 확인해 주세요.');
  const hdr=aoa[h].map(H),col=n=>hdr.indexOf(n);if(hdr.some(x=>/처방전교부번호|수진자|주민/.test(x)))throw new Error('환자 정보가 있는 파일이라 받지 않아요.');
  const c={code:col('약품코드'),co:col('제약회사'),unit:col('재고단위'),base:col('기본수량'),cur:col('현재고'),opt:col('적정재고')};if(c.cur<0)throw new Error('현재고 열이 없어요.');
  let rows=[];for(let i=h+1;i<aoa.length;i++){const r=aoa[i];if(!String(r[nc]).trim())continue;rows.push([String(r[nc]).trim(),c.code>=0?String(r[c.code]):'',c.co>=0?String(r[c.co]):'',c.unit>=0?String(r[c.unit]):'',c.base>=0?+r[c.base]||1:1,+r[c.cur]||0,c.opt>=0?+r[c.opt]||0:0])}
  if(!rows.length)throw new Error('품목을 읽지 못했어요.');
  // 현재고 0 이하는 저장하지 않음 (품목이 너무 많아짐). 단, 조제 기록이 있는 약은 0이어도 남겨서 발주 목록에 뜨게 함
  const PF=(S.profile&&S.profile.items)||{};const all=rows.length;
  rows=rows.filter(r=>r[5]>0||(PF[String(r[1])]&&!PF[String(r[1])].dead&&(PF[String(r[1])].d>0||PF[String(r[1])].p>0)));const skipped=all-rows.length;
  if(!rows.length)throw new Error('현재고가 있는 품목이 없어요.');
  const meta=String(aoa.slice(0,h).flat().find(x=>/검색기간|재고금액/.test(String(x)))||'');const dm=meta.match(/~\s*(\d{8})/);
  const d=new Date();const date=dm?dm[1]:`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  const doc={meta,date,rows,source:source||'upload',savedAt:new Date().toISOString()};
  if(S.stock&&S.stock.date&&S.stock.date!==date){if(!await saveDoc('stock/previous',S.stock))return;S.prev=S.stock}
  if(await saveDoc('stock/current',doc)){S.stock=doc;renderToday();toast(`${fmt(rows.length)}품목 재고를 저장했어요 (${dateLabel(date)})${skipped?` · 재고 0 ${fmt(skipped)}품목 제외`:''}`);redrawPanel&&redrawPanel();return{ok:true,kind:'stock',n:rows.length,skipped,date}}
  return{ok:false}
 }catch(err){toast(err.message||'파일을 읽지 못했어요');return{ok:false,error:err.message}}}
async function onDispFile(e){const f=e.target.files[0];e.target.value='';if(!f)return;
 if(!window.XLSX){toast('엑셀 읽기 도구를 불러오지 못했어요');return}
 await importDisp(new Uint8Array(await f.arrayBuffer()))}
async function importDisp(buf){
 try{const aoa=readAoa(buf);const {h,nc}=findHdr(aoa);
  if(h<0)throw new Error('약품명 열을 찾지 못했어요. 조제약품현황이나 사용량(재고현황및재고수정) 파일인지 확인해 주세요.');
  const hdr=aoa[h].map(H),col=n=>hdr.indexOf(n);if(hdr.some(x=>/처방전교부번호|수진자|주민/.test(x)))throw new Error('환자 정보가 있는 파일이라 받지 않아요.');
  const c={code:col('약품코드'),ws:col('사입거래처'),price:col('약품단가'),qty:col('조제수량'),cnt:col('조제건수'),use:col('사용량')};
  if((c.qty<0||c.cnt<0)&&c.use>=0)return await importUse(aoa,h,nc,c);
  if(c.qty<0||c.cnt<0)throw new Error('조제수량·조제건수(또는 사용량) 열이 없어요.');
  const per=+S.settings.periodDays||184;const items={};let cur=null;
  for(let i=h+1;i<aoa.length;i++){const r=aoa[i];const nm=String(r[nc]).trim();
   if(nm&&isNaN(+nm)){const code=String(r[c.code]).trim();cur=items[code]=items[code]||{w:c.ws>=0?String(r[c.ws]).trim():'',u:+r[c.price]||0,q:0,n:0};cur.q+=+r[c.qty]||0;cur.n+=+r[c.cnt]||0}
   else if(!nm&&cur&&r[c.qty]!==''){cur.q+=+r[c.qty]||0;cur.n+=+r[c.cnt]||0}
   else if(nm&&!isNaN(+nm))break}
  const out={};Object.entries(items).forEach(([code,x])=>{if(!code)return;out[code]={w:x.w,u:x.u,n:x.n,d:Math.round(x.q/per*1000)/1000,p:x.n?Math.round(x.q/x.n*100)/100:0}});
  (S.stock&&S.stock.rows||[]).forEach(r=>{const code=String(r[1]);if(String(r[0]).includes('_(')&&!out[code])out[code]={w:'',u:0,n:0,d:0,p:0,dead:1}});
  const doc={periodDays:per,items:out,savedAt:new Date().toISOString()};
  if(await saveDoc('profile/current',doc)){S.profile=doc;renderToday();toast(`조제 ${Object.keys(items).length}품목으로 적정재고를 다시 계산했어요`);redrawPanel&&redrawPanel();return{ok:true,kind:'disp',n:Object.keys(items).length}}
  return{ok:false}
 }catch(err){toast(err.message||'파일을 읽지 못했어요');return{ok:false,error:err.message}}}

/* 이팜 "재고현황및재고수정" (약품코드·약품명·사용량·재고량): 검색기간 동안의 사용량으로 하루 평균 사용량을 다시 계산.
   사입처·단가·처방 1건 크기는 이 파일에 없어서, 전에 올린 조제약품현황 값을 그대로 이어 씀 */
async function importUse(aoa,h,nc,c){
 if(c.code<0)throw new Error('약품코드 열이 없어요.');
 const days=searchDays(aoa,h)||+S.settings.periodDays||184;const old=(S.profile&&S.profile.items)||{};const out={};let used=0;
 for(let i=h+1;i<aoa.length;i++){const r=aoa[i];const nm=String(r[nc]).trim(),code=String(r[c.code]).trim();if(!nm||!code||out[code])continue;
  const q=+r[c.use]||0,o=old[code]||{};
  if(q>0){used++;out[code]={w:o.w||'',u:o.u||0,n:o.n||0,d:Math.round(q/days*1000)/1000,p:o.dead?0:(o.p||0)}}
  else if(nm.includes('_('))out[code]={w:o.w||'',u:o.u||0,n:0,d:0,p:0,dead:1}}
 if(!Object.keys(out).length)throw new Error('품목을 읽지 못했어요.');
 const doc={periodDays:days,source:'use',items:out,savedAt:new Date().toISOString()};
 if(await saveDoc('profile/current',doc)){S.profile=doc;renderToday();toast(`사용량 ${fmt(used)}품목(${days}일)으로 적정재고를 다시 계산했어요`);redrawPanel&&redrawPanel();return{ok:true,kind:'disp',n:used}}
 return{ok:false}}

};

const ABX={

 '클래리트로마이신':{alias:/클래리|클라리스로|클래리스로/,day:[15,15],div:2,every:'12시간마다 (1일 2회)',maxDose:500,concs:[[25,'125mg/5mL'],[50,'250mg/5mL']],note:'1회 7.5mg/kg, 12시간마다 (1일 15mg/kg). 1회 500mg을 넘지 않음.',src:'클래리시드건조시럽 허가사항 (약학정보원)'},
 '세프디니르':{alias:/세프디니르|옴니세프|애니세프/,day:[9,18],div:3,every:'1일 3회',concs:[],note:'1일 9~18mg/kg을 3회로 나눠 복용. 세립은 제품마다 g당 함량이 달라 mg으로만 계산함.',src:'세프디니르세립 허가사항 (약학정보원)'}
};
function abxDose(key,w,conc){
 const d=ABX[key],down=x=>Math.floor(x*10)/10,concs=+conc>0?[[+conc,`입력 농도 ${+conc}mg/mL`]]:d.concs;
 const ml=mg=>concs.length?concs.map(([c,l])=>`${l}: ${down(mg/c)}mL`).join(' / '):'mL 계산은 제품 농도가 필요함';
 if(d.azi){const a=10*w,b=5*w,c=30*w;return{성분:key,체중kg:w,'3일 요법':`1일 1회 ${Math.round(a)}mg → ${ml(a)}, 3일`,'5일 요법':`첫날 ${Math.round(a)}mg → ${ml(a)}, 이후 ${Math.round(b)}mg → ${ml(b)}`,'중이염 1회 요법':`${Math.round(c)}mg → ${ml(c)}`,주의:d.note,용도:'처방 용량이 허가 범위 안인지 확인하는 용도. 항생제 용량은 처방의가 정함',근거:d.src}}
 const per=x=>x*w/d.div;let lo=per(d.day[0]),hi=per(d.day[1]);if(d.maxDose){lo=Math.min(lo,d.maxDose);hi=Math.min(hi,d.maxDose)}
 if(d.maxDay){lo=Math.min(lo,d.maxDay/d.div);hi=Math.min(hi,d.maxDay/d.div)}
 return{성분:key+(d.basis?` (${d.basis})`:''),체중kg:w,'1회 용량':lo===hi?`${Math.round(lo)}mg → ${ml(lo)}`:!concs.length?`${Math.round(lo)}~${Math.round(hi)}mg (제품 농도를 알려주면 mL로 계산)`:`${Math.round(lo)}~${Math.round(hi)}mg → 기본 ${ml(lo)} · 중증 ${ml(hi)}`,복용:d.every,계산식:`1일 ${d.day[0]===d.day[1]?d.day[0]:d.day[0]+'~'+d.day[1]}mg/kg × ${w}kg ÷ ${d.div}회`,주의:d.note,용도:'처방 용량이 허가 범위 안인지 확인하는 용도. 항생제 용량은 처방의가 정함',근거:d.src};
}
function pediatricDose(drug,kg,conc){
 const ak=Object.keys(ABX).find(k=>ABX[k].alias.test(String(drug)));if(ak){const w=+kg;if(!(w>0&&w<60))return{오류:'체중(kg)을 1~60 사이로 알려주세요.'};return abxDose(ak,w,conc)}
 const key=Object.keys(PED).find(k=>String(drug).includes(k.slice(0,4)))||(/타이레놀|세토펜|챔프/.test(drug)?'아세트아미노펜':/맥시|덱시/.test(drug)?'덱시부프로펜':/부루펜|이부/.test(drug)?'이부프로펜':null);
 const w=+kg;if(!key)return{오류:'계산할 수 있는 약: 해열진통제(아세트아미노펜·이부프로펜·덱시부프로펜), 항생제(세파클러·아목시실린/클라불란산 7:1·아지스로마이신·클래리트로마이신·세프디니르)'};if(!(w>0&&w<60))return{오류:'체중(kg)을 1~60 사이로 알려주세요.'};
 const d=PED[key],c=+conc>0?+conc:d.conc,up=x=>Math.ceil(x*2)/2,down=x=>Math.floor(x*2)/2;
 const lo=d.mg[0]*w,hi=d.mg[1]*w,dayMax=Math.min(d.maxPerKg*w,d.maxAbs,d.cap30&&w<=30?d.cap30:Infinity);
 let mlLo=up(lo/c),mlHi=down(hi/c);if(mlLo>mlHi)mlLo=mlHi;
 return{성분:key,체중kg:w,기준제형:`${d.form}${+conc>0?` → 입력 농도 ${c}mg/mL로 계산`:''}`,'1회 용량':`${Math.round(lo)}~${Math.round(hi)}mg → ${mlLo===mlHi?mlLo:mlLo+'~'+mlHi}mL (0.5mL 단위, 범위 안쪽으로 맞춤)`,간격:d.interval,'1일 최대':`${d.maxTimes}회, ${Math.round(dayMax)}mg (${down(dayMax/c)}mL) 이내`,계산식:`1회 ${d.mg[0]}~${d.mg[1]}mg/kg × ${w}kg ÷ ${c}mg/mL, 1일 최대 ${d.maxPerKg}mg/kg`,주의:d.note,확인:'제품 허가사항의 연령·용량표와 반드시 대조'};
}

function stockView(i,withAlt){const o={약품:i.base,성분:i.ing||undefined,함량:i.str||undefined,현재고:r1(i.cur),단위:i.unit,적정재고:i.opt||'없음',적정근거:i.src,사입처:i.ws||undefined,
  하루평균조제:i.daily?r1(i.daily):undefined,남은일수:i.days!=null?Math.round(i.days):undefined,상태:i.dead?'6개월간 조제 없음':i.opt>0?(i.cur<i.opt?'적정 미만':'여유'):'적정 없음',제약회사:i.co};
 if(withAlt&&i.key){const alt=(M.byKey[i.key]||[]).filter(x=>x!==i).sort((a,b)=>b.cur-a.cur).slice(0,6).map(x=>`${x.base} ${fmt(x.cur)}${x.unit}`);if(alt.length)o.같은성분같은함량=alt}
 return o}
function searchStock(q){if(!M)return{안내:'재고 자료가 없음. 설정에서 재고현황을 올려야 함'};
 const nq=norm(q);let res=M.items.filter(i=>i.hay.includes(nq));
 if(!res.length){const ts=tokens(q).map(norm);res=M.items.filter(i=>ts.some(t=>i.hay.includes(t)))}
 res.sort((a,b)=>(norm(a.base).startsWith(nq)?0:1)-(norm(b.base).startsWith(nq)?0:1)||b.cur-a.cur);
 return{기준일:dateLabel(M.date),찾은개수:res.length,결과:res.slice(0,8).map((i,k)=>stockView(i,k<3)),안내:res.length?undefined:'재고 파일에 없음. 재고가 0이면 파일에 없을 수 있음'}}
function orderList(ws){if(!M)return{안내:'재고 자료가 없음'};let low=M.low;if(ws){const n=norm(ws);low=low.filter(i=>norm(i.ws).includes(n)||norm(i.co).includes(n))}
 return{기준일:dateLabel(M.date),기준:`적정재고 = 하루 평균 조제량 × ${M.cover}일과 처방 1건 평균 중 큰 값 (품목 예외 우선)`,품목수:low.length,
  사입처별:Object.fromEntries(groupBy(low,i=>i.ws||'사입처 정보 없음').map(([k,a])=>[k,a.map(i=>`${i.base}${i.str?' '+i.str:''}: 현재 ${fmt(i.cur)} / 적정 ${fmt(i.opt)} (부족 ${fmt(r1(i.opt-i.cur))}${i.unit}${i.days!=null?', 약 '+Math.round(i.days)+'일치 남음':''})`)]))}}
function stockChanges(){if(!M)return{안내:'재고 자료가 없음'};if(!S.prev)return{안내:'비교할 이전 재고가 없음'};
 return{비교:`${dateLabel(M.prevDate)} → ${dateLabel(M.date)}`,새로재고0:M.gone.map(g=>parseName(g.name).base),빨리나간약:M.drop.slice(0,15).map(i=>`${i.base}: ${fmt(i.prev)} → ${fmt(i.cur)} (평소 하루 ${fmt(r1(i.daily))})`),

function score(text,q){const t=norm(text);const ts=tokens(q).map(norm);let s=0;ts.forEach(x=>{if(t.includes(x))s+=x.length>=3?2:1});if(t.includes(norm(q)))s+=5;return s}

function rules(){return `너는 동네약국 "${S.settings.name||'우리 약국'}"의 직원과 약사가 쓰는 업무 도우미야. 한국어로 짧고 정확하게 답해.
규칙:
1. 제공된 도구로 찾은 자료만 근거로 답해. 자료에 없으면 추측하지 말고 "자료에 없어요"라고 말한 뒤 가까운 항목을 알려줘. 프로그램 메뉴 경로를 지어내지 마.
2. 재고 수량·적정재고·남은 일수는 반드시 search_stock, order_list, stock_changes 결과로만 말하고 기준일을 붙여. 같은 성분 대체품이 있으면 함께 알려줘.
3. 업무 절차·거래처 연락처는 search_manual로 찾아. 메뉴 경로는 "A > B > C"로 그대로 보여줘.
4. 환자 오해는 search_cards로 찾아 판정, 설명 문구, 진료 권유 신호를 알려줘.
5. OTC 상담은 otc_rules로 기준을 불러와. 위험 신호가 하나라도 해당되면 진료 권유를 먼저. 정보가 부족하면 꼭 필요한 것만 되물어. 성분은 권장/주의/피함으로 나누고 "최종 판단은 약사"를 덧붙여.
6. 소아 시럽 용량(해열진통제·항생제)은 반드시 pediatric_dose 결과로만 답하고 직접 계산하지 마. 체중을 모르면 먼저 물어. 항생제는 처방 용량이 허가 범위 안인지 확인하는 용도라고 밝히고, 제품 농도(예: 125mg/5mL, 250mg/5mL)를 확인하게 해. 처방이 범위를 벗어나면 처방의 확인을 권해.
7. 복용약 점검은 성분으로 풀어 중복, 1일 총량(계산식), 상호작용 후보, 고령·임신·신장/간 주의를 정리하고 "DUR과 허가사항으로 최종 확인"을 붙여.
8. 영양제·일반약 추천은 search_stock으로 우리 약국 제품과 재고를 함께 알려줘.
10. "알림", "~시에 알려줘", "메모해 둬"는 add_alarm·add_memo로 바로 등록하고 등록 결과(내용, 첫 알림, 반복)를 한 줄로 알려줘. 시각이 애매하면(예: "오후에") 한 번만 되물어. 등록된 알림 질문은 list_alarms로. 지금은 ${(()=>{const n=new Date();return `${n.getFullYear()}-${pad2(n.getMonth()+1)}-${pad2(n.getDate())} (${WD[n.getDay()]}) ${pad2(n.getHours())}:${pad2(n.getMinutes())}`})()}.
9. 환자 이름·주민번호 등 개인정보가 보이면 무시하고 반복하지 마. 사진은 보이는 약 이름·함량을 먼저 말하고, 읽기 어려우면 다시 찍어 달라고 해.
형식: 첫 줄에 결론. 그다음 필요한 숫자·단계를 "- "로. 마지막 줄에 "출처: 재고 자료/업무 수첩/OTC 상담 기준/대응 카드/용량 계산" 중 쓴 것. 표·제목(#)은 쓰지 말고 굵게는 **만.`}

const MCOLORS={yellow:'노랑',pink:'분홍',blue:'파랑',green:'초록',purple:'보라'};
const REP={once:'한 번',daily:'매일',weekday:'평일(월~금)',weekly:'매주',monthly:'매월',monthEnd:'매월 말일'};
const WD='일월화수목금토';
const ALARM_PRESETS=[
 {text:'마감 정산',rep:'daily',time:'19:00'},
 {text:'냉장 보관약 온도 기록',rep:'weekday',time:'09:00'},
 {text:'반품 보낼 약 정리',rep:'weekly',days:[5],time:'16:00'},
 {text:'사용기한 임박 약 점검',rep:'monthly',dom:1,time:'10:00'},
 {text:'도매상 결제',rep:'monthly',dom:25,time:'11:00'},
 {text:'청구 마감 확인',rep:'monthEnd',time:'15:00'}
];
S.memo={memos:[],alarms:[]};S.members=[];S.notices=[];S.pharm=null;
const ME=()=>window.__me||'local';
const myName=()=>{const m=S.members.find(x=>x.uid===ME());return m?m.name:''};
const nameOf=uid=>{const m=S.members.find(x=>x.uid===uid);return m?m.name:''};
const isFor=a=>!a.to||!a.to.length||a.to.includes(ME());
const ackAt=a=>Math.max(a.ack||0,(a.acks||{})[ME()]||0);
const snzAt=a=>Math.max(a.snooze||0,(a.snz||{})[ME()]||0);
function ackAlarm(a){a.acks={...(a.acks||{}),[ME()]:Date.now()};a.snz={...(a.snz||{}),[ME()]:0}}
function snoozeAlarm(a,t){a.snz={...(a.snz||{}),[ME()]:t}}
function toLabel(a){if(!a.to||!a.to.length)return S.members.length>1?'모두':'';if(a.to.length===1&&a.to[0]===ME())return '나만';return a.to.map(u=>u===ME()?'나':nameOf(u)||'?').join('·')}
const unreadNotices=()=>S.notices.filter(n=>n.by!==ME()&&!(n.reads||{})[ME()]);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad2=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const lastDay=d=>new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
function aStart(a){const [y,m,d]=a.date.split('-').map(Number);const [h,mi]=(a.time||'09:00').split(':').map(Number);return new Date(y,m-1,d,h,mi)}
function aMatch(a,d){switch(a.rep){case 'daily':return true;case 'weekday':return d.getDay()>0&&d.getDay()<6;case 'weekly':return (a.days||[]).includes(d.getDay());
 case 'monthly':return d.getDate()===Math.min(+a.dom||1,lastDay(d));case 'monthEnd':return d.getDate()===lastDay(d);default:return ymd(d)===a.date}}
function occOn(a,d){const [h,mi]=(a.time||'09:00').split(':').map(Number);return new Date(d.getFullYear(),d.getMonth(),d.getDate(),h,mi)}
function latestOcc(a,now){const st=aStart(a);if(a.rep==='once')return st<=now?st:null;
 for(let i=0;i<62;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()-i);const o=occOn(a,d);if(o>now||!aMatch(a,d))continue;if(o<st)return null;return o}return null}
function nextOcc(a,now){const st=aStart(a);if(a.rep==='once')return st>now?st:null;
 for(let i=0;i<400;i++){const d=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i);const o=occOn(a,d);if(o>now&&o>=st&&aMatch(a,d))return o}return null}
function whenLabel(o){if(!o)return '';const n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());const dd=Math.round((new Date(o.getFullYear(),o.getMonth(),o.getDate())-t)/864e5);
 const day=dd===0?'오늘':dd===1?'내일':dd===-1?'어제':`${o.getMonth()+1}/${o.getDate()} (${WD[o.getDay()]})`;return `${day} ${pad2(o.getHours())}:${pad2(o.getMinutes())}`}
function repLabel(a){if(a.rep==='weekly')return '매주 '+(a.days||[]).slice().sort().map(x=>WD[x]).join('·');if(a.rep==='monthly')return `매월 ${a.dom}일${a.dom>28?'(없으면 말일)':''}`;if(a.rep==='once')return '한 번';return REP[a.rep]||''}
function dueAlarms(now=new Date()){return S.memo.alarms.filter(a=>{if(!a.on||!isFor(a))return false;const o=latestOcc(a,now);return o&&o.getTime()>ackAt(a)&&!(snzAt(a)>now.getTime())})}
async function saveMemo(){const ok=await saveDoc('memo/main',{memos:S.memo.memos,alarms:S.memo.alarms,savedAt:new Date().toISOString()});renderMemoHome();renderStickies();return ok}
function addAlarm(o){const now=new Date();const a={id:uid(),text:String(o.text||'').slice(0,300),color:MCOLORS[o.color]?o.color:'yellow',date:o.date||ymd(now),time:o.time||'09:00',rep:REP[o.rep]?o.rep:'once',days:(o.days||[]).map(Number).filter(x=>x>=0&&x<7),dom:Math.min(31,Math.max(1,+o.dom||1)),on:true,ack:now.getTime(),snooze:0,at:now.toISOString(),to:Array.isArray(o.to)&&o.to.length?o.to:null,by:ME(),byName:myName()};
 if(a.rep==='weekly'&&!a.days.length)a.days=[aStart(a).getDay()];S.memo.alarms.push(a);return a}
function addMemo(o){const m={id:uid(),text:String(o.text||'').slice(0,2000),color:MCOLORS[o.color]?o.color:'yellow',pin:!!o.pin,at:new Date().toISOString(),by:ME(),byName:myName()};S.memo.memos.unshift(m);return m}

 const now=new Date();const nx=S.memo.alarms.filter(a=>a.on).map(a=>[nextOcc(a,now),a]).filter(x=>x[0]).sort((x,y)=>x[0]-y[0])[0];

let audioCtx=null,shown=new Set(),titleTimer=null;
document.addEventListener('pointerdown',()=>{try{if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume()}catch(e){}},{passive:true});
function chime(){try{if(!audioCtx)return;const t=audioCtx.currentTime;[[880,0],[1175,.18],[880,.5],[1175,.68]].forEach(([f,s])=>{const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,t+s);g.gain.linearRampToValueAtTime(.18,t+s+.02);g.gain.exponentialRampToValueAtTime(.001,t+s+.4);o.connect(g).connect(audioCtx.destination);o.start(t+s);o.stop(t+s+.45)})}catch(e){}}
function flashTitle(n){clearInterval(titleTimer);const base=$('title').textContent;if(!n){document.title=base;return}let on=false;titleTimer=setInterval(()=>{on=!on;document.title=on?`🔔 알림 ${n}개`:base},1000)}
function renderStickies(){
 const due=dueAlarms();const box=$('stickies');const now=new Date();const nts=unreadNotices();
 const fresh=due.filter(a=>!shown.has(a.id+':'+latestOcc(a,now).getTime())).concat(nts.filter(n=>!shown.has('n:'+n.id)).map(n=>({id:'n:'+n.id,isN:1,text:n.text})));
 box.innerHTML=nts.map((n,i)=>`<div class="sticky c-${n.important?'pink':'blue'}" role="alertdialog" aria-label="공지" style="--r:${[.8,-1,.5][i%3]}deg"><div class="st-h"><span>📢 공지 · ${esc(n.byName||nameOf(n.by)||'')}</span><span class="st-rep">${esc(whenLabel(new Date(n.at)))}</span></div><div class="st-t">${esc(n.text)}</div><div class="st-a"><button type="button" class="st-ok" data-nread="${n.id}">확인했어요</button></div></div>`).join('')+due.map((a,i)=>{const o=latestOcc(a,now);const late=now-o>15*6e4;
  return `<div class="sticky c-${a.color}" role="alertdialog" aria-label="알림" style="--r:${[-1.2,.8,-.4,1.1][i%4]}deg">
   <div class="st-h"><span>🔔 ${whenLabel(o)}${late?' · 놓친 알림':''}</span><span class="st-rep">${esc(repLabel(a))}</span></div>
   <div class="st-t">${esc(a.text)}</div>
   <div class="st-a"><button type="button" class="st-ok" data-ok="${a.id}">확인</button><button type="button" data-sn="${a.id}" data-m="10">10분 뒤</button><button type="button" data-sn="${a.id}" data-m="60">1시간 뒤</button><button type="button" data-sn="${a.id}" data-m="tomorrow">내일</button></div></div>`}).join('');
 box.hidden=!due.length&&!nts.length;
 box.querySelectorAll('[data-nread]').forEach(b=>b.onclick=()=>{window.noticeRead&&noticeRead(b.dataset.nread)});
 box.querySelectorAll('[data-ok]').forEach(b=>b.onclick=()=>{const a=S.memo.alarms.find(x=>x.id===b.dataset.ok);if(!a)return;ackAlarm(a);saveMemo();redrawPanel&&panelState.kind==='memo'&&redrawPanel()});
 box.querySelectorAll('[data-sn]').forEach(b=>b.onclick=()=>{const a=S.memo.alarms.find(x=>x.id===b.dataset.sn);if(!a)return;const m=b.dataset.m;
  if(m==='tomorrow'){const t=new Date();t.setDate(t.getDate()+1);t.setHours(9,0,0,0);snoozeAlarm(a,t.getTime())}else snoozeAlarm(a,Date.now()+(+m)*6e4);
  saveMemo();toast(m==='tomorrow'?'내일 오전 9시에 다시 알려 드릴게요':`${m==='60'?'1시간':'10분'} 뒤에 다시 알려 드릴게요`)});
 if(fresh.length){fresh.forEach(a=>shown.add(a.isN?a.id:a.id+':'+latestOcc(a,now).getTime()));chime();
  try{if(document.hidden&&'Notification' in window&&Notification.permission==='granted')fresh.forEach(a=>new Notification('🔔 '+(S.settings.name||'약국')+' 알림',{body:a.text}))}catch(e){}}
 flashTitle(document.hidden?due.length+nts.length:0);
}

async function syPushWhole(p,d){if(!SY.pid||!WHOLE.includes(p)||!d)return;const j=JSON.stringify(d);if(j.length>900000){toast('자료가 너무 커서 연동하지 못했어요: '+p);return}
 const at=Date.now();SY.pushedAt[p]=at;SY.seenAt[enc(p)]=at;try{await SY.cloud.set(P()+'/data/'+enc(p),{j,by:SY.dev,at});syStatus('on')}catch(e){syStatus('err',errMsg(e))}}
let memoPushT=null;
function syPushMemo(){if(!SY.pid)return;clearTimeout(memoPushT);memoPushT=setTimeout(async()=>{const ops=[];
 for(const kind of ['memos','alarms']){const cur={};(S.memo[kind]||[]).forEach(x=>cur[x.id]=stripMemo(x));const base=SY.base[kind];
  for(const id in cur){const s=canon(cur[id]);if(base[id]!==s){const prev=base[id]?JSON.parse(base[id]):null;base[id]=s;
    // 확인·다시 알림은 사람마다 따로 → 다른 사람 것과 합쳐지도록 merge
    ops.push(SY.cloud.set(P()+'/'+kind+'/'+id,{...cur[id],_by:SY.dev},kind==='alarms'&&!!prev))}}
  for(const id in base)if(!cur[id]){delete base[id];ops.push(SY.cloud.del(P()+'/'+kind+'/'+id))}}
 try{await Promise.all(ops);if(ops.length)syStatus('on')}catch(e){syStatus('err',errMsg(e))}},250)}
function syPush(p,d){if(!SY.pid)return;if(p==='memo/main')syPushMemo();else syPushWhole(p,d)}
function syApplyWhole(o){for(const id in o){const p=dec(id),x=o[id];if(!WHOLE.includes(p)||!x||!x.j)continue;if((SY.seenAt[id]||0)>=x.at)continue;SY.seenAt[id]=x.at;
  if(x.by===SY.dev&&SY.pushedAt[p]===x.at)continue;try{DESKDB.applyRemote(p,JSON.parse(x.j))}catch(e){}}syStatus('on')}
function syApplyMemo(kind,o){const remote={};for(const id in o){const {_by,...r}=o[id];remote[id]=r}
 const base=SY.base[kind],loc={};(S.memo[kind]||[]).forEach(x=>loc[x.id]=x);const out={};let pending=false;
 for(const id in remote){const l=loc[id];
  if(l&&base[id]!==undefined&&base[id]!==canon(stripMemo(l))){out[id]=l;pending=true}
  else if(!l&&base[id]!==undefined&&base[id]!==canon(remote[id])){out[id]=remote[id]}
  else if(!l&&base[id]!==undefined){pending=true}
  else out[id]=l&&l.desk?{...remote[id],desk:l.desk}:remote[id]}
 for(const id in loc)if(!(id in remote)){if(base[id]===undefined){out[id]=loc[id];pending=true}}
 SY.base[kind]=Object.fromEntries(Object.entries(remote).map(([id,x])=>[id,canon(x)]));
 const arr=Object.values(out).sort(kind==='memos'?(a,b)=>String(b.at).localeCompare(String(a.at)):(a,b)=>String(a.at).localeCompare(String(b.at)));
 const next={memos:S.memo.memos||[],alarms:S.memo.alarms||[],[kind]:arr};
 if(canon(stripAll(next))!==canon(stripAll(S.memo)))DESKDB.applyRemote('memo/main',{...next,savedAt:new Date().toISOString()});
 if(pending)syPushMemo();syStatus('on')}

async function syStartPharm(pid){SY.pid=pid;SY.phase='in';syStatus('wait');
 try{
  const remote=await SY.cloud.getAll(P()+'/data');const rm=await SY.cloud.getAll(P()+'/memos'),ra=await SY.cloud.getAll(P()+'/alarms');
  const empty=!Object.keys(remote).length&&!Object.keys(rm).length&&!Object.keys(ra).length;let down=0;
  for(const p of WHOLE){const x=remote[enc(p)];const loc=DESKDB.get(p);
   if(x&&x.j){SY.seenAt[enc(p)]=x.at;DESKDB.applyRemote(p,JSON.parse(x.j));down++}else if(loc)await syPushWhole(p,loc)}
  SY.base={memos:{},alarms:{}};syApplyMemo('memos',rm);syApplyMemo('alarms',ra);syPushMemo();
  const W=(f)=>SY.unsub.push(f);const err=e=>syStatus('err',errMsg(e));
  W(SY.cloud.watchDoc(P(),d=>{S.pharm=d;renderMemoHome();syRedraw()},err));
  W(SY.cloud.watchCol(P()+'/members',o=>{S.members=Object.entries(o).map(([u,m])=>({uid:u,...m})).sort((a,b)=>(a.role==='owner'?0:a.role==='admin'?1:2)-(b.role==='owner'?0:b.role==='admin'?1:2)||String(a.name).localeCompare(String(b.name)));

  W(SY.cloud.watchCol(P()+'/data',syApplyWhole,err));
  W(SY.cloud.watchCol(P()+'/memos',o=>syApplyMemo('memos',o),err));
  if(typeof teamWatch==='function')teamWatch(W,err);
  W(SY.cloud.watchCol(P()+'/alarms',o=>syApplyMemo('alarms',o),err));
  syStatus('on');if(empty)toast('이 기기 자료를 약국 공간에 올렸어요');else if(down)toast('약국 자료를 받아 왔어요');

/* --- 한국어 알림 문장 읽기 --- */
const WDN={일:0,월:1,화:2,수:3,목:4,금:5,토:6};
function parseAlarm(q){
 let s=' '+q.replace(/\s+/g,' ')+' ',now=new Date(),date=null,rep='once',days=[],dom=null,h=null,mi=0,rel=null,guess='';
 const cut=re=>{const m=s.match(re);if(m)s=s.replace(m[0],' ');return m};
 let m;
 if(m=cut(/(\d+)\s*분\s*(뒤|후)/))rel=+m[1]*6e4;
 else if(m=cut(/(\d+)\s*시간\s*(?:(\d+)\s*분\s*)?(뒤|후)/))rel=+m[1]*36e5+(+m[2]||0)*6e4;
 else if(m=cut(/(한|두|세)\s*시간\s*(뒤|후)/))rel={한:1,두:2,세:3}[m[1]]*36e5;
 if(cut(/매일|날마다|하루\s*한\s*번/))rep='daily';
 else if(cut(/평일|주중|월\s*~\s*금/))rep='weekday';
 else if(m=cut(/(?:매주|주마다)\s*([일월화수목금토](?:\s*[,·\s]\s*[일월화수목금토])*)\s*요일?/)){rep='weekly';days=[...new Set(m[1].match(/[일월화수목금토]/g).map(c=>WDN[c]))]}
 else if(m=cut(/(?:매월|매달|달마다)\s*말일/)){rep='monthEnd'}
 else if(m=cut(/(?:매월|매달|달마다)\s*(\d{1,2})\s*일/)){rep='monthly';dom=+m[1]}
 if(m=cut(/(\d{1,2})\s*월\s*(\d{1,2})\s*일/)){date=new Date(now.getFullYear(),+m[1]-1,+m[2]);if(date<new Date(now.getFullYear(),now.getMonth(),now.getDate()))date.setFullYear(date.getFullYear()+1)}
 else if(m=cut(/(?:^|\s)(\d{1,2})\/(\d{1,2})(?=\s)/)){date=new Date(now.getFullYear(),+m[1]-1,+m[2])}
 else if(cut(/오늘/))date=new Date(now);
 else if(cut(/내일/))date=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
 else if(cut(/모레/))date=new Date(now.getFullYear(),now.getMonth(),now.getDate()+2);
 else if(cut(/글피/))date=new Date(now.getFullYear(),now.getMonth(),now.getDate()+3);
 else if(m=cut(/(\d+)\s*일\s*(뒤|후)/))date=new Date(now.getFullYear(),now.getMonth(),now.getDate()+(+m[1]));
 else if(rep==='once'&&(m=cut(/(다음\s*주|담주|이번\s*주)?\s*([일월화수목금토])요일/))){const want=WDN[m[2]],t0=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  if(m[1]){const mon=new Date(t0);mon.setDate(t0.getDate()-((t0.getDay()+6)%7)+(/다음|담/.test(m[1])?7:0));date=new Date(mon);date.setDate(mon.getDate()+((want+6)%7))}
  else{date=new Date(t0);date.setDate(t0.getDate()+((want-t0.getDay()+7)%7))}}
 const ap=cut(/오전|아침|새벽|오후|저녁|밤|낮|점심/);
 if(m=cut(/(\d{1,2}):(\d{2})/)){h=+m[1];mi=+m[2]}
 else if(m=cut(/(\d{1,2})\s*시\s*(?:(\d{1,2})\s*분|(반)(?![가-힣]))?/)){h=+m[1];mi=m[3]?30:(+m[2]||0)}
 else if(ap&&/점심/.test(ap[0])){h=12}
 if(h!=null&&ap){const a=ap[0];if(/오후|저녁|밤/.test(a)&&h<12)h+=12;if(/낮/.test(a)&&h<7)h+=12;if(/오전|아침|새벽/.test(a)&&h===12)h=0}
 else if(h!=null&&h>=1&&h<=7){h+=12;guess='오후로 알아들었어요. '}
 const text=s.replace(/(에|에는)?\s*(알림|알람)\s*(을|좀)?\s*(등록|설정|맞춰|만들어)?\s*(해\s*줘|해줘|해\s*주세요|줘|해)?/g,' ').replace(/알려\s*(줘|주세요|달라)|깨워\s*줘|리마인드/g,' ').replace(/(^|\s)(에|에는|까지|부터)(?=\s)/g,' ').replace(/[,.?!]+/g,' ').replace(/\s+/g,' ').trim();
 if(rel){const t=new Date(now.getTime()+rel);return{text,date:ymd(t),time:`${pad2(t.getHours())}:${pad2(t.getMinutes())}`,rep:'once',days:[],dom:1,guess}}
 if(h==null)return{text,need:'time',date:date?ymd(date):ymd(now),rep,days,dom:dom||now.getDate()};
 if(!date){date=new Date(now);if(rep==='once'&&(h*60+mi)<=(now.getHours()*60+now.getMinutes()))date.setDate(date.getDate()+1)}
 if(rep==='weekly'&&!days.length)days=[date.getDay()];
 return{text,date:ymd(date),time:`${pad2(h)}:${pad2(mi)}`,rep,days,dom:dom||date.getDate(),guess}}

 const TIMEISH=/\d+\s*시|\d+\s*분\s*(뒤|후)|\d+\s*시간\s*(뒤|후)|내일|모레|글피|[일월화수목금토]요일|매일|매주|매월|매달|평일|\d+:\d{2}/;
 if((/알림|알람|리마인드|깨워\s*줘/.test(q)||(/알려\s*줘/.test(q)&&TIMEISH.test(q)))&&!/알림\s*(기능|방법)/.test(q)){const p=parseAlarm(q);

const baseW=()=>(S.shiftDocs.base&&S.shiftDocs.base.w)||{};

function dayShift(s){const ov=shiftOverride(s);const wd=pd(s).getDay();const b=baseW();
 const list=ov||(offDay(s)?[]:S.members).filter(m=>b[m.uid]&&b[m.uid][wd]).map(m=>({u:m.uid,t:b[m.uid][wd]}));

const isRed=s=>pd(s).getDay()===0||!!HOLI[s]||S.events.some(e=>e.kind==='off'&&e.from<=s&&s<=(e.to||e.from));

function calPending(){const mgr=isMgr();return (mgr?S.leaves.filter(l=>l.status==='pending').length+S.swaps.filter(w=>w.status==='accepted').length:0)+S.swaps.filter(w=>w.status==='asked'&&w.to===ME()).length}

 const myRecent=S.leaves.filter(l=>l.uid===ME()&&l.status!=='pending'&&(l.to||l.from)>=todayS()).concat(S.swaps.filter(w=>(w.from===ME()||w.to===ME())&&['approved','rejected','declined'].includes(w.status)&&w.date>=todayS()));
 const reqCard=pl.length||sw.length||myRecent.length?`<div class="card"><h3>휴가·근무 교환 요청 <span class="c">${pl.length+sw.length}</span></h3><div class="alist">

  ${sw.map(w=>`<div class="mrow"><span><b>${esc(w.fromName||memName(w.from))}</b>의 ${dLabel(w.date)} 근무 → <b>${w.to?esc(w.toName||memName(w.to)):'누구나'}</b>${w.back?`<br><span class="sub">대신 ${dLabel(w.back)} ${esc(w.toName||'상대')} 근무를 ${esc(w.fromName||'')}이(가) 함</span>`:''}${w.note?`<br><span class="sub">${esc(w.note)}</span>`:''}<br><span class="sub">${SWAP_ST[w.status]}</span></span>
   <span class="row">${w.status==='asked'&&w.from!==ME()&&(w.to===ME()||w.to==='')?`<button class="btn sm primary" type="button" data-wa="${w.id}">수락</button>${w.to===ME()?`<button class="btn sm" type="button" data-wd="${w.id}">거절</button>`:''}`:''}${mgr&&w.status==='accepted'?`<button class="btn sm primary" type="button" data-wp="${w.id}">승인·반영</button><button class="btn sm" type="button" data-wr="${w.id}">반려</button>`:''}${w.from===ME()?`<button class="btn sm danger" type="button" data-wc="${w.id}">요청 취소</button>`:''}</span></div>`).join('')}
  ${myRecent.map(x=>x.kind?`<div class="mrow"><span>내 휴가 ${esc(x.kind)} · ${dLabel(x.from)}${x.to&&x.to!==x.from?' ~ '+dLabel(x.to):''}</span><span class="sub">${LEAVE_ST[x.status]}</span></div>`:`<div class="mrow"><span>근무 교환 ${dLabel(x.date)} · ${esc(x.fromName||'')} → ${esc(x.toName||'')}</span><span class="sub">${SWAP_ST[x.status]}</span></div>`).join('')}
 </div></div>`:'';
 body.innerHTML=`<div class="calh"><button class="iconbtn" type="button" id="cPrev" aria-label="이전 달">‹</button><b>${y}년 ${m+1}월</b><button class="iconbtn" type="button" id="cNext" aria-label="다음 달">›</button><button class="btn sm" type="button" id="cToday">오늘</button></div>
  <div class="cal">${[...WD].map((w,i)=>`<span class="wh ${i===0?'su':i===6?'sa':''}">${w}</span>`).join('')}${cells.join('')}</div>

  ${dayCard}${reqCard}

function calFormHtml(kind,s){

 if(kind==='shift'){const cur=dayShift(s);

 if(q('#fReset'))q('#fReset').onclick=async()=>{if(await saveDayShift(s,null))done('기본 근무로 되돌렸어요')};
 if(q('#fSaveB'))q('#fSaveB').onclick=async()=>{const w={};body.querySelectorAll('[data-bu]').forEach(i=>{const v=i.value.trim().slice(0,20);if(v)(w[i.dataset.bu]=w[i.dataset.bu]||{})[i.dataset.bd]=v});

 // 휴가 결재

 body.querySelectorAll('[data-lr]').forEach(b=>b.onclick=async()=>{if(await tSet(P()+'/leaves/'+b.dataset.lr,{status:'rejected',decBy:ME(),decAt:Date.now()},true))toast('반려했어요')});
 body.querySelectorAll('[data-lc]').forEach(b=>armBtn(b,async()=>{if(await tSet(P()+'/leaves/'+b.dataset.lc,{status:'cancelled'},true))toast('신청을 취소했어요')},'정말 취소'));

 body.querySelectorAll('[data-wa]').forEach(b=>b.onclick=async()=>{const w=S.swaps.find(x=>x.id===b.dataset.wa);if(w.back&&w.to!==ME()&&!dayShift(w.back).some(x=>x.u===ME())){toast('그날 내 근무가 없어요');return}
  if(await tSet(P()+'/swaps/'+w.id,{to:ME(),toName:myName(),status:'accepted',acceptedAt:Date.now()},true))toast('수락했어요. 국장님·관리자 승인 뒤 반영돼요')});
 body.querySelectorAll('[data-wd]').forEach(b=>b.onclick=async()=>{const w=S.swaps.find(x=>x.id===b.dataset.wd);if(await tSet(P()+'/swaps/'+w.id,{to:ME(),toName:myName(),status:'declined',acceptedAt:Date.now()},true))toast('거절했어요')});
 body.querySelectorAll('[data-wc]').forEach(b=>armBtn(b,async()=>{if(await tSet(P()+'/swaps/'+b.dataset.wc,{status:'cancelled'},true))toast('요청을 취소했어요')},'정말 취소'));
 body.querySelectorAll('[data-wr]').forEach(b=>b.onclick=async()=>{if(await tSet(P()+'/swaps/'+b.dataset.wr,{status:'rejected',decBy:ME(),decAt:Date.now()},true))toast('반려했어요')});
 body.querySelectorAll('[data-wp]').forEach(b=>b.onclick=async()=>{const w=S.swaps.find(x=>x.id===b.dataset.wp);if(!w||!w.to)return;
  const swapIn=(day,out,inn)=>{const cur=dayShift(day).map(({u,t})=>({u,t}));const i=cur.findIndex(x=>x.u===out);if(i<0)return null;if(cur.some(x=>x.u===inn))return cur.filter(x=>x.u!==out);cur[i]={u:inn,t:cur[i].t};return cur};
  const a=swapIn(w.date,w.from,w.to);if(!a){toast(`${dLabel(w.date)}에 ${w.fromName} 님 근무가 없어요`);return}
  const b2=w.back?swapIn(w.back,w.to,w.from):null;if(w.back&&!b2){toast(`${dLabel(w.back)}에 ${w.toName} 님 근무가 없어요`);return}
  if(!await saveDayShift(w.date,a))return;if(b2&&!await saveDayShift(w.back,b2))return;
  if(await tSet(P()+'/swaps/'+w.id,{status:'approved',decBy:ME(),decAt:Date.now()},true))toast('승인하고 근무표에 반영했어요')});
}

/* --- 인수인계 (자유 게시판) --- */
let handEdit=null;
const handKey=()=>'cb-hand-seen-'+(SY.pid||'');
const handSeen=()=>{try{return +localStorage.getItem(handKey())||0}catch(e){return 0}};
const handNew=()=>S.handover.filter(h=>h.by!==ME()&&h.at>handSeen()).length;
function drawHand(body){
 const mgr=isMgr();const list=S.handover.slice().sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.at-a.at);
 try{localStorage.setItem(handKey(),String(Date.now()))}catch(e){}setTimeout(renderTeamTiles,0);
 const ed=handEdit&&S.handover.find(h=>h.id===handEdit);
 body.innerHTML=`<div class="card memo-new c-green" id="hForm"><h3>${ed?'인수인계 고치기':'인수인계 남기기'}</h3><textarea id="hText" rows="4" placeholder="다음 근무자에게 남길 내용">${ed?esc(ed.text):''}</textarea>
  <div class="row" style="justify-content:space-between"><label class="chk"><input type="checkbox" id="hPin" ${ed&&ed.pin?'checked':''}> 위에 고정</label><span class="row">${ed?'<button class="btn" type="button" id="hCancel">취소</button>':''}<button class="btn primary" type="button" id="hSave">${ed?'고치기':'남기기'}</button></span></div></div>
  <div class="alist">${list.length?list.map(h=>{const cm=Object.entries(h.cm||{}).filter(([,c])=>c&&c.text).map(([id,c])=>({id,...c})).sort((a,b)=>a.at-b.at);
   return `<div class="notice hand ${h.pin?'imp':''}"><div class="nh"><b>${h.pin?'📌 ':''}${esc(h.byName||memName(h.by))}</b><span class="sub">${esc(whenLabel(new Date(h.at)))}${h.edAt?' · 고침':''}</span></div><div class="nb">${nlbr(h.text)}</div>
    ${cm.length?`<div class="cms">${cm.map(c=>`<div class="cmt"><b>${esc(c.byName||memName(c.by))}</b> ${esc(c.text)} <span class="sub">${esc(whenLabel(new Date(c.at)))}</span>${c.by===ME()||mgr?` <button class="linkbtn" type="button" data-cx="${h.id}|${c.id}">지우기</button>`:''}</div>`).join('')}</div>`:''}
    <div class="nf"><span class="row grow"><input class="cin" data-ci="${h.id}" placeholder="댓글"><button class="btn sm" type="button" data-cs="${h.id}">달기</button></span>
    ${h.by===ME()||mgr?`<span class="row"><button class="btn sm" type="button" data-he="${h.id}">고치기</button><button class="btn sm danger" type="button" data-hx="${h.id}">삭제</button></span>`:''}</div></div>`}).join(''):'<p class="muted">아직 인수인계가 없어요.</p>'}</div>`;
 const q=s=>body.querySelector(s);
 q('#hSave').onclick=async()=>{const text=q('#hText').value.trim();if(!text){toast('내용을 적어 주세요');return}const pin=q('#hPin').checked;q('#hSave').disabled=true;
  const ok=ed?await tSet(P()+'/handover/'+ed.id,{text:text.slice(0,4000),pin,edAt:Date.now()},true):await tSet(P()+'/handover/'+uid(),{text:text.slice(0,4000),pin,by:ME(),byName:myName(),at:Date.now(),cm:{}});
  if(ok){toast(ed?'고쳤어요':'인수인계를 남겼어요');handEdit=null;redrawPanel()}else q('#hSave').disabled=false};
 if(q('#hCancel'))q('#hCancel').onclick=()=>{handEdit=null;redrawPanel()};
 const send=async id=>{const i=body.querySelector(`[data-ci="${id}"]`);const t=i.value.trim();if(!t)return;i.value='';await tSet(P()+'/handover/'+id,{cm:{[uid()]:{by:ME(),byName:myName(),text:t.slice(0,500),at:Date.now()}}},true)};
 body.querySelectorAll('[data-cs]').forEach(b=>b.onclick=()=>send(b.dataset.cs));
 body.querySelectorAll('[data-ci]').forEach(i=>i.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();send(i.dataset.ci)}});
 body.querySelectorAll('[data-cx]').forEach(b=>armBtn(b,()=>{const [h,c]=b.dataset.cx.split('|');tSet(P()+'/handover/'+h,{cm:{[c]:deleteMark()}},true)},'정말?'));
 body.querySelectorAll('[data-he]').forEach(b=>b.onclick=()=>{handEdit=b.dataset.he;redrawPanel();body.scrollTop=0});
 body.querySelectorAll('[data-hx]').forEach(b=>armBtn(b,()=>tDel(P()+'/handover/'+b.dataset.hx)));
}
// 댓글 지우기: Firestore에서는 필드 삭제 표시, 가짜 서버에서는 null
function deleteMark(){return window.FB&&window.FB.deleteField&&!window.__fakeCloud?window.FB.deleteField():null}

/* --- 패널·첫 화면 --- */
function teamTabs(){return [['notice','공지사항',unreadNotices().length||null],['order','전달사항',myTodo().length||null],['cal','캘린더',calPending()||null],['hand','인수인계',handNew()||null]]}
function drawTeam(body){const t=panelState.tab;if(t==='order')return drawOrders(body);if(t==='cal')return drawCal(body);if(t==='hand')return drawHand(body);return drawNotices(body)}
const TEAM_TILES=[['notice','공지사항','t-notice','<path d="M3 11l14-6v14L3 13z"/><path d="M7 13v5a2 2 0 0 0 4 0v-4"/><path d="M20 9v6"/>'],
 ['order','국장님 전달사항','t-order','<path d="M9 4h6a1 1 0 0 1 1 1v1H8V5a1 1 0 0 1 1-1z"/><path d="M16 5h2a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2h2"/><path d="M8.5 13l2.2 2.2L15.5 10.5"/>'],
 ['cal','약국 캘린더','t-cal','<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8 14h2M14 14h2M8 17h2"/>'],
 ['hand','인수인계','t-hand','<path d="M4 7h11l-3-3M20 17H9l3 3"/>']];
function teamTilesInit(){if($('teamTiles'))return;const t=document.querySelector('.tiles');if(!t)return;
 const st=document.createElement('style');st.textContent=TEAM_CSS;document.head.appendChild(st);
 const d=document.createElement('div');d.className='tiles team';d.id='teamTiles';d.hidden=true;
 d.innerHTML=TEAM_TILES.map(([k,l,c,svg])=>`<button class="tile" type="button" data-tt="${k}"><span class="ti ${c}"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${svg}</svg></span><span class="tt">${l}</span><span class="ts" data-ts="${k}"></span></button>`).join('');
 t.after(d);d.querySelectorAll('[data-tt]').forEach(b=>b.onclick=()=>openPanel('team',b.dataset.tt))}
function renderTeamTiles(){teamTilesInit();const d=$('teamTiles');if(!d)return;d.hidden=!S.pharm;if(!S.pharm)return;
 const set=(k,txt,ring)=>{const s=d.querySelector(`[data-ts="${k}"]`);if(s)s.textContent=txt;const b=d.querySelector(`[data-tt="${k}"]`);if(b)b.classList.toggle('ring',!!ring)};
 const un=unreadNotices().length,last=S.notices.slice().sort((a,b)=>b.at-a.at)[0];
 set('notice',un?`안 읽은 공지 ${un}개`:last?last.text:'약국 전체 공지',un);
 const todo=myTodo(),mgr=isMgr(),open=S.orders.filter(o=>!orderDone(o)).length;
 set('order',todo.length?`할 일 ${todo.length}개 · ${todo[0].text}`:mgr?(open?`진행 중 ${open}개`:'업무 지시 보내기'):'받은 지시 없음',todo.some(o=>!orderSt(o).seen));
 const s=todayS(),sh=dayShift(s).filter(x=>!x.leave),pend=calPending();
 set('cal',pend?`확인할 요청 ${pend}개`:HOLI[s]?`오늘 ${HOLI[s]}`:sh.length?`오늘 근무 ${sh.map(x=>memName(x.u)).join(', ')}`:'근무표 · 휴가 · 일정',pend);
 const hn=handNew(),lh=S.handover.slice().sort((a,b)=>b.at-a.at)[0];
 set('hand',hn?`새 인수인계 ${hn}개`:lh?`${lh.byName||''}: ${lh.text}`:'다음 근무자에게 남기기',hn)}
setInterval(()=>{if(S.pharm)renderTeamTiles()},60000);

/* ===== 웹(휴대폰) 버전 ===== */
let DESKDB=null;const WEB_KEY='cb-web-docs';
async function deskDb(){let docs={};try{docs=JSON.parse(localStorage.getItem(WEB_KEY)||'{}')}catch(e){}
 const subs={};const persist=()=>{try{localStorage.setItem(WEB_KEY,JSON.stringify(docs))}catch(e){}};
 const fire=(p,d)=>(subs[p]||[]).forEach(f=>f({exists:!!d,data:()=>d}));
 DESKDB={get:p=>docs[p],applyRemote:(p,d)=>{docs[p]=d;persist();fire(p,d)}};
 return{doc:p=>({set:async d=>{docs[p]=d;persist();syPush(p,d)},onSnapshot:f=>{(subs[p]=subs[p]||[]).push(f);setTimeout(()=>f({exists:!!docs[p],data:()=>docs[p]}),0);return()=>{}}})}}
function webBanner(){const b=$('banner');if(!b)return;const need=SY.cloud&&(SY.phase==='out'||SY.phase==='nopharm');
 if(need){b.hidden=false;b.classList.add('cta');b.innerHTML=SY.phase==='out'?'<b>약국 계정으로 로그인하세요</b><br>공지·알림·재고를 약국 PC와 같이 받아요 ›':'<b>약국에 들어가세요</b><br>국장님께 받은 초대 코드를 넣으면 돼요 ›';b.onclick=()=>openPanel('settings','account')}
 else if(b.classList.contains('cta')){b.hidden=true;b.classList.remove('cta');b.onclick=null}}
function webBoot(){syInit();setInterval(webBanner,1500);setTimeout(webBanner,600);
 if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{})}

renderFavs();
(async()=>{
 
 const [dbNs,smp]=[await deskDb(),null];
 db=dbNs;sample=smp;
 if(sample){const lim=await sample.limits().catch(()=>null);useTools=!!(lim&&lim.tools);canImg=!!(lim&&lim.images);$('attachLbl').hidden=!canImg}
 if(!db){$('banner').hidden=false;$('banner').textContent='이 화면에서는 약국 자료 저장소를 열 수 없어요.';return}

 watch('exceptions/main',d=>S.exc=(d&&d.items)||{});
 watch('manual/main',d=>{S.manual=(d&&d.items)||[];renderBook()});

 webBoot();
})();
