<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>메모</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; font-src 'self'">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
.c-yellow{--pi:#FFF3B0;--pi-2:#F2D45C;--pi-ink:#4A3B00}.c-pink{--pi:#FFD9E2;--pi-2:#F29BB2;--pi-ink:#5A1428}.c-blue{--pi:#D8E8FF;--pi-2:#8FB6EE;--pi-ink:#14305A}
.c-green{--pi:#D6F3DF;--pi-2:#86CFA0;--pi-ink:#12432A}.c-purple{--pi:#E8DDFF;--pi-2:#B49BEE;--pi-ink:#33175E}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--pi);color:var(--pi-ink);font-family:"Jua","Malgun Gothic",sans-serif}
body{display:flex;flex-direction:column}
.bar{height:26px;background:var(--pi-2);display:flex;align-items:center;justify-content:flex-end;gap:2px;padding:0 4px;-webkit-app-region:drag;flex:0 0 auto}
.bar button{-webkit-app-region:no-drag;border:0;background:transparent;color:var(--pi-ink);font:inherit;font-size:13px;width:24px;height:22px;border-radius:5px;cursor:pointer;opacity:.75;padding:0}
.bar button:hover{opacity:1;background:rgba(255,255,255,.4)}
.bar button[aria-pressed="true"]{opacity:1;background:rgba(255,255,255,.55)}
textarea{flex:1;border:0;background:transparent;color:inherit;font:inherit;font-size:16px;line-height:1.5;padding:10px 12px;resize:none;outline:none}
.colors{position:absolute;top:28px;right:6px;display:flex;gap:5px;background:#fff;padding:6px;border-radius:9px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.colors button{width:20px;height:20px;border-radius:50%;border:2px solid var(--pi-2);background:var(--pi);cursor:pointer;padding:0}
</style></head><body class="c-yellow">
<div class="bar"><button id="col" title="색 바꾸기" aria-label="색 바꾸기">🎨</button><button id="top" title="항상 위" aria-label="항상 위에 두기" aria-pressed="false">📌</button><button id="off" title="바탕화면에서 떼기 (메모는 남아요)" aria-label="바탕화면에서 떼기">✕</button></div>
<textarea id="t" aria-label="메모 내용" spellcheck="false"></textarea>
<div class="colors" id="cols" hidden></div>
<script>
const id=new URLSearchParams(location.search).get('id');let m=null,timer=null;
const C=['yellow','pink','blue','green','purple'];
function apply(x){m=x;if(!m)return;document.body.className='c-'+(m.color||'yellow');if(document.activeElement!==t)t.value=m.text;topB.setAttribute('aria-pressed',m.desk&&m.desk.top?'true':'false')}
const t=document.getElementById('t'),topB=document.getElementById('top'),cols=document.getElementById('cols');
window.desk.memoGet(id).then(apply);window.desk.onMemo(apply);
t.addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(()=>window.desk.memoUpdate(id,{text:t.value}),400)});
t.addEventListener('blur',()=>{clearTimeout(timer);window.desk.memoUpdate(id,{text:t.value})});
topB.onclick=()=>{const on=topB.getAttribute('aria-pressed')!=='true';topB.setAttribute('aria-pressed',on);window.desk.memoUpdate(id,{desk:{top:on}})};
document.getElementById('off').onclick=()=>window.desk.memoUpdate(id,{desk:null});
cols.innerHTML=C.map(c=>`<button class="c-${c}" data-c="${c}" aria-label="${c}"></button>`).join('');
document.getElementById('col').onclick=()=>cols.hidden=!cols.hidden;
cols.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.body.className='c-'+b.dataset.c;cols.hidden=true;window.desk.memoUpdate(id,{color:b.dataset.c})});
</script></body></html>
